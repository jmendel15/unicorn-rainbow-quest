<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Unicorn Quest">
  <meta name="theme-color" content="#ffd6ef">
  <title>Unicorn Rainbow Quest</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <button id="homeBtn" class="round" aria-label="Back to stages">🏠</button>
    <div id="slots" aria-label="Stars collected"></div>
    <button id="soundBtn" class="round" aria-label="Sound on or off">🔊</button>
  </div>

  <section id="title" class="screen">
    <h1>Unicorn<br>Rainbow Quest</h1>
    <button id="playBtn" class="big pulse" aria-label="Play">▶</button>
  </section>

  <section id="map" class="screen hidden">
    <div class="map-title">Pick a stage</div>
    <div id="stageList"></div>
  </section>

  <section id="goal" class="screen overlay hidden">
    <div class="card">
      <div id="goalIcon"></div>
      <div id="goalText"></div>
      <div class="hint">👆 Tap to start</div>
    </div>
  </section>

  <section id="win" class="screen overlay hidden">
    <div class="card">
      <div class="win-title">Hooray!</div>
      <div class="row">
        <button id="againBtn" class="big" aria-label="Play again">↻</button>
        <button id="mapBtn" class="big alt" aria-label="Back to stages">🏠</button>
      </div>
    </div>
  </section>

  <script src="game.js?v=3"></script>
</body>
</html>
